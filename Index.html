<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Calculadora de equivalencias</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:#111}
.wrap{max-width:600px;margin:0 auto;padding:20px 16px 40px}
.card{background:#fff;border-radius:24px;padding:24px 20px;box-shadow:0 5px 24px rgba(0,0,0,.08)}
h1{font-size:28px;line-height:1.15;margin:0 0 26px}
label{display:block;font-size:17px;font-weight:700;margin:18px 0 7px}
select,input{width:100%;height:54px;border:1px solid #c9c9ce;border-radius:12px;background:#fff;padding:0 14px;font-size:17px;color:#111}
.result{margin-top:24px;min-height:72px;background:#eaf5df;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;padding:12px}
.help{color:#666;font-size:14px;line-height:1.4;margin-top:14px}
.example{margin-top:18px;padding:14px;border-radius:12px;background:#f5f5f7;font-size:14px;line-height:1.4}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Calculadora de equivalencias</h1>

<label for="meal">Comida / bloque</label>
<select id="meal"><option value="Comida 1.1">Comida 1.1</option><option value="Comida 1.2">Comida 1.2</option><option value="Comida 1.3">Comida 1.3</option><option value="Comida 1.4">Comida 1.4</option><option value="Comida 2.1">Comida 2.1</option><option value="Comida 2.2">Comida 2.2</option><option value="Comida 2.3">Comida 2.3</option><option value="Comida 3.1">Comida 3.1</option><option value="Comida 3.2">Comida 3.2</option><option value="Comida 3.3">Comida 3.3</option></select>

<label for="from">Alimento que consumes</label>
<select id="from"><option value="0">Pan — 70g</option><option value="1">Tortitas arroz — 50g</option><option value="2">Avena — 50g</option><option value="3">Crema arroz — 50g</option></select>

<label for="qty">Cantidad que consumes</label>
<input id="qty" type="number" inputmode="decimal" value="25" step="0.1" min="0">

<label for="to">Alimento equivalente</label>
<select id="to"><option value="0">Pan — 70g</option><option value="1">Tortitas arroz — 50g</option><option value="2">Avena — 50g</option><option value="3">Crema arroz — 50g</option></select>

<div class="result" id="result">35 g de Pan</div>
<div class="help">El cálculo mantiene la proporción de tu tabla. Los alimentos disponibles cambian al seleccionar la comida.</div>
<div class="example"><b>Ejemplo:</b> en Comida 1.1, 25 g de Tortitas de arroz equivalen a 35 g de Pan.</div>
</div></div>

<script>
const data = {"Comida 1.1": [["Pan", 70, "g"], ["Tortitas arroz", 50, "g"], ["Avena", 50, "g"], ["Crema arroz", 50, "g"]], "Comida 1.2": [["Bebida vegetal", 300, "ml"], ["Leche desnatada", 300, "ml"], ["Queso batido", 200, "g"]], "Comida 1.3": [["Huevos", 2, "ud"], ["Jamon serrano", 70, "g"], ["Lomo embuchado", 70, "g"], ["Proteina Whey", 30, "g"]], "Comida 1.4": [["Aceite", 10, "ml"], ["Frutos secos", 20, "g"], ["Chocolate", 20, "g"], ["Queso curado", 40, "g"], ["Aceitunas", 80, "g"]], "Comida 2.1": [["Arroz", 80, "g"], ["Pasta", 80, "g"], ["Tortitas arroz", 80, "g"], ["Tortitas maiz", 80, "g"], ["Patata", 320, "g"], ["Boniato", 320, "g"], ["Legumbre cocida", 240, "g"], ["Gnocchi patata", 160, "g"], ["Pan", 110, "g"]], "Comida 2.2": [["Pollo", 100, "g"], ["Pavo", 100, "g"], ["Lomo cerdo", 100, "g"], ["Sepia", 120, "g"], ["Calamar", 120, "g"], ["Langostinos", 120, "g"], ["Claras", 200, "g"]], "Comida 2.3": [["Aceite", 10, "ml"], ["Frutos secos", 20, "g"], ["Chocolate", 20, "g"], ["Queso curado", 40, "g"], ["Aceitunas", 80, "g"]], "Comida 3.1": [["Arroz", 80, "g"], ["Pasta", 80, "g"], ["Tortitas arroz", 80, "g"], ["Tortitas maiz", 80, "g"], ["Patata", 320, "g"], ["Boniato", 320, "g"], ["Legumbre cocida", 240, "g"], ["Gnocchi patata", 160, "g"], ["Pan", 110, "g"], ["Pan de pita Trigo/Maiz", 105, "g"]], "Comida 3.2": [["Pollo", 100, "g"], ["Pavo", 100, "g"], ["Lomo cerdo", 100, "g"], ["Sepia", 120, "g"], ["Calamar", 120, "g"], ["Langostinos", 120, "g"], ["Claras", 200, "g"], ["Atun", 50, "g"]], "Comida 3.3": [["Frutos secos", 10, "g"], ["Chocolate", 10, "g"], ["Queso curado", 20, "g"], ["Aceitunas", 80, "g"]]};
const meal = document.getElementById('meal');
const from = document.getElementById('from');
const to = document.getElementById('to');
const qty = document.getElementById('qty');
const result = document.getElementById('result');

function fillFoods() {
  const items = data[meal.value];
  from.innerHTML = '';
  to.innerHTML = '';
  items.forEach((x,i) => {
    const label = x[0] + ' — ' + x[1] + x[2];
    from.add(new Option(label, i));
    to.add(new Option(label, i));
  });
  // Valores iniciales útiles
  from.selectedIndex = 0;
  to.selectedIndex = Math.min(1, items.length-1);
  calc();
}

function calc() {
  const items = data[meal.value];
  const a = items[Number(from.value)];
  const b = items[Number(to.value)];
  const q = parseFloat(qty.value);
  if (!a || !b || !isFinite(q)) { result.textContent = 'Introduce una cantidad'; return; }
  const out = q * b[1] / a[1];
  const rounded = Math.round((out + Number.EPSILON)*10)/10;
  result.textContent = (Number.isInteger(rounded) ? rounded : rounded.toFixed(1)) + ' ' + b[2] + ' de ' + b[0];
}

meal.addEventListener('change', fillFoods);
from.addEventListener('change', calc);
to.addEventListener('change', calc);
qty.addEventListener('input', calc);
</script>
</body></html>
